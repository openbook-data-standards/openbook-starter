[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbook-starter"
version = "0.1.0"
description = "OpenBook publisher starter CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
translations = ["openbook-translate"]
dev = ["pytest"]

[project.scripts]
openbook = "openbook_starter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
